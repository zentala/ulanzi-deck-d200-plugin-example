name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".plan/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".plan/**"

jobs:
  plugin:
    name: Plugin demo (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulanzi-demos/plugins/demo/io.zentala.ulanzideck.demo.ulanziPlugin
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ulanzi-demos/plugins/demo/io.zentala.ulanzideck.demo.ulanziPlugin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  usb-demo:
    name: USB demo (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulanzi-demos/usb/demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ulanzi-demos/usb/demo/pyproject.toml
      - run: pip install -e .
      - run: pip install pytest pytest-cov
      - run: pytest
